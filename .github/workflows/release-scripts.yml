name: Release FFXIV2GO

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  package-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    # 1. 获取代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 安装 .NET 10 SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # 3. 发布自包含单文件 exe
    - name: Publish self-contained single file
      run: |
        dotnet publish src/FFXIV2GO/FFXIV2GO.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

    # 4. 创建版本信息文件
    - name: Create version info
      run: |
        echo "Version: ${{ github.ref_name }}" > version.txt
        echo "Build Date: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")" >> version.txt
        echo "FFXIV2GO - Portable Final Fantasy XIV Environment Toolkit" >> version.txt

    # 5. 打包 exe + apps.json + 版本文件到 ZIP
    - name: Create FFXIV2GO ZIP package
      run: |
        Compress-Archive -Path publish/FFXIV2GO.exe, apps.json, version.txt -DestinationPath FFXIV2GO_${{ github.ref_name }}.zip

    # 6. 发布到固定的 latest Release
    - name: Release to Latest
      uses: ncipollo/release-action@v1
      with:
        tag: 'latest'
        allowUpdates: true
        makeLatest: true
        artifacts: 'FFXIV2GO_${{ github.ref_name }}.zip'
        name: 'FFXIV2GO - Latest Version'
        generateReleaseNotes: true
