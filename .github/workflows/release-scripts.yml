name: Release FFXIV2GO

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v 前缀，如 1.1.0）；留空则使用分支名'
        required: false
        default: ''

jobs:
  package-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    # 1. 获取代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 安装 .NET 10 SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # 3. 运行单元测试（失败即停，防止发布坏版本）
    - name: Run tests
      run: dotnet test --configuration Release

    # 4. 解析发布版本（tag 去 v 前缀；手动触发用输入；缺省回退 run_id）
    - name: Resolve version
      id: version
      shell: pwsh
      run: |
        if ("${{ github.event_name }}" -eq "push") {
          $v = "${{ github.ref_name }}".TrimStart('v')
        } elseif ("${{ github.event.inputs.version }}" -ne "") {
          $v = "${{ github.event.inputs.version }}"
        } else {
          $v = "dev-${{ github.run_id }}"
        }
        Write-Output "version=$v" >> $env:GITHUB_OUTPUT
        Write-Output "date=$(Get-Date -Format "yyyy-MM-dd HH:mm:ss")" >> $env:GITHUB_OUTPUT

    # 5. 发布自包含单文件 exe（文件版本与 ZIP 版本统一）
    - name: Publish self-contained single file
      run: |
        dotnet publish src/FFXIV2GO/FFXIV2GO.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=${{ steps.version.outputs.version }} -o publish

    # 6. 打包 exe + apps.json + 版本文件到 ZIP（固定名 + 带版本号，供 latest / 版本 Release）
    - name: Create FFXIV2GO ZIP package
      run: |
        New-Item -ItemType Directory -Force -Path package
        echo "Version: ${{ steps.version.outputs.version }}" > package/version.txt
        echo "Build Date: ${{ steps.version.outputs.date }}" >> package/version.txt
        echo "FFXIV2GO - Portable Final Fantasy XIV Environment Toolkit" >> package/version.txt
        Compress-Archive -Path publish/FFXIV2GO.exe, apps.json, package/version.txt -DestinationPath package/FFXIV2GO.zip
        Copy-Item package/FFXIV2GO.zip package/FFXIV2GO_${{ steps.version.outputs.version }}.zip

    # 7. 上传 artifact 供调试（即使 Release 失败也可下载）
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FFXIV2GO-${{ steps.version.outputs.version }}
        path: package/*.zip

    # 8. 发布版本 Release（仅 tag 推送时；真实 tag 保证自动 changelog 准确）
    - name: Release version
      if: github.event_name == 'push'
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ github.ref_name }}
        allowUpdates: true
        makeLatest: true
        generateReleaseNotes: true
        artifacts: 'package/FFXIV2GO_${{ steps.version.outputs.version }}.zip'
        name: 'FFXIV2GO ${{ github.ref_name }}'
        body: |
          ## FFXIV2GO ${{ steps.version.outputs.version }}

          - 版本：`${{ steps.version.outputs.version }}`
          - 构建日期：`${{ steps.version.outputs.date }}`

          ### 使用说明

          1. 解压 ZIP 到部署根目录（如 U盘、移动硬盘、网盘）
          2. 运行 FFXIV2GO.exe（首次启动自动提权）
          3. 按初始化 → 安装 → 卸载 → 清理 顺序使用
        draft: false
        prerelease: false

    # 9. 更新固定的 latest Release（URL 稳定，供直接下载）
    - name: Update latest Release
      uses: ncipollo/release-action@v1
      with:
        tag: 'latest'
        allowUpdates: true
        makeLatest: false
        artifacts: 'package/FFXIV2GO.zip'
        name: 'FFXIV2GO - Latest Version'
        body: |
          ## FFXIV2GO ${{ steps.version.outputs.version }}

          - 版本：`${{ steps.version.outputs.version }}`
          - 构建日期：`${{ steps.version.outputs.date }}`
          - 完整变更记录见对应版本的 Release（`v*` tag）

          ### 使用说明

          1. 解压 ZIP 到部署根目录（如 U盘、移动硬盘、网盘）
          2. 运行 FFXIV2GO.exe（首次启动自动提权）
          3. 按初始化 → 安装 → 卸载 → 清理 顺序使用
        draft: false
        prerelease: false
